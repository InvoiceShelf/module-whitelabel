name: Check

# Run this workflow every time a new commit pushed to your repository
on:
    push:
        paths-ignore:
            - '**/*.md'
            - 'public/build/*.js'
            - 'public/build/**/*.js'
        branches-ignore:    
            - 'translations'
    pull_request:
        paths-ignore:
            - '**/*.md'
            - 'public/build/*.js'
            - 'public/build/**/*.js'
        branches-ignore:    
            - 'translations'
    # Allow manually triggering the workflow.
    workflow_dispatch:

jobs:
    kill_previous:
        name: 0️⃣ Kill previous runs
        runs-on: ubuntu-latest
        # We want to run on external PRs, but not on our own internal PRs as they'll be run by the push to the branch.
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
        steps:
            - name: Cancel Previous Runs
              uses: styfle/cancel-workflow-action@0.12.1
              with:
                  access_token: ${{ github.token }}

    # A copy of InvoiceShelf's own workflow used to run here: `pint` from a
    # vendor directory the module never installs, `php artisan test` and a
    # `make dist` of InvoiceShelf.zip, none of which a module has. It is now the
    # style check alone; release.yaml builds the module's zip.
    php_syntax_errors:
        name: 1️⃣ PHP Code Style errors
        runs-on: ubuntu-latest
        needs:
            - kill_previous
        steps:
            - name: Set up PHP with Pint
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: pint:1.29.0
                  coverage: none

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Check code style
              run: pint --test

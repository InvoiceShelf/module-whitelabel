name: release

on:
  release:
    types: [published]
  # Rebuilds the zip for a release that already exists and replaces its asset.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v1.1.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: [ubuntu-latest]

    steps:
      # The module is for InvoiceShelf 2.x and bundles host code from it, so it is
      # built against the 2.x branch, not the default branch (3.x).
      - name: Checkout InvoiceShelf 2.x
        uses: actions/checkout@v4
        with:
          repository: InvoiceShelf/InvoiceShelf
          ref: 2.x

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: bcmath, curl, dom, gd, imagick, json, libxml, mbstring, pcntl, pdo, pdo_mysql, zip
          coverage: none

      - name: Install InvoiceShelf composer dependencies
        uses: ramsey/composer-install@v2
        with:
          composer-options: --no-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The module build resolves pinia, axios and host components from here.
      - name: Install InvoiceShelf node dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout WhiteLabel module
        uses: actions/checkout@v4
        with:
          path: Modules/WhiteLabel

      - name: Install WhiteLabel module composer dependencies
        uses: ramsey/composer-install@v2
        with:
          composer-options: --no-dev
          working-directory: "Modules/WhiteLabel"

      - name: Install and build WhiteLabel module package
        run: bash ./Modules/WhiteLabel/scripts/artifact-gen.sh

      - name: Publish package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload --clobber -R $REPO $TAG ./Modules/WhiteLabel/build/WhiteLabel.zip
